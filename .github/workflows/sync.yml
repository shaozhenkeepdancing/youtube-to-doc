name: Sync YouTube Transcript to Google Doc

on:
  schedule:
    - cron: '0 0 * * *' # 每天 00:00 UTC (北京时间 08:00) 运行一次
  workflow_dispatch: # 支持手动触发测试

# 给予 GitHub Actions 自动 Commit 和 Push 的权限
permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/parent-python-setup@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Transcript Sync
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: Commit & Push processed videos record
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_videos.txt
          # 仅当 processed_videos.txt 发生变化时才提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update processed videos log [skip ci]" && git push)
